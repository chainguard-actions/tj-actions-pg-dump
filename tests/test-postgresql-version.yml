name: Test pg-dump with postgresql_version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install and start PostgreSQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql postgresql-client
          sudo service postgresql start
          # Wait for PostgreSQL to be ready
          for i in $(seq 1 30); do
            if sudo -u postgres pg_isready -q; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i)"
            sleep 1
          done
          # Create test user and database
          sudo -u postgres psql -c "CREATE USER pgversionuser WITH PASSWORD 'pgversionpass';"
          sudo -u postgres psql -c "CREATE DATABASE pgversiondb OWNER pgversionuser;"
          sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE pgversiondb TO pgversionuser;"
      - name: Create a test table and insert data
        run: |
          PGPASSWORD=pgversionpass psql -h localhost -U pgversionuser -d pgversiondb -c "CREATE TABLE version_table (id SERIAL PRIMARY KEY, value TEXT);"
          PGPASSWORD=pgversionpass psql -h localhost -U pgversionuser -d pgversiondb -c "INSERT INTO version_table (value) VALUES ('version-test');"
      - name: Detect installed PostgreSQL version
        id: pg_version
        run: |
          VERSION=$(psql --version | grep -oP '\d+' | head -1)
          echo "Detected PostgreSQL major version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        with:
          postgresql_version: ${{ steps.pg_version.outputs.version }}
          database_url: "postgresql://pgversionuser:pgversionpass@localhost:5432/pgversiondb"
          path: "${{ github.workspace }}/backups/version-backup.sql"
          options: "-O"
      - name: Assert backup file was created
        run: |
          echo "Checking if backup file exists..."
          if [ ! -f "$GITHUB_WORKSPACE/backups/version-backup.sql" ]; then
            echo "FAIL: backup file was not created"
            exit 1
          fi
          echo "PASS: backup file exists"
      - name: Assert backup file is non-empty
        run: |
          SIZE=$(wc -c < "$GITHUB_WORKSPACE/backups/version-backup.sql")
          echo "Backup file size: $SIZE bytes"
          if [ "$SIZE" -eq 0 ]; then
            echo "FAIL: backup file is empty"
            exit 1
          fi
          echo "PASS: backup file is non-empty"
      - name: Assert backup file contains expected SQL
        run: |
          echo "Checking backup file content..."
          if ! grep -q "version_table" "$GITHUB_WORKSPACE/backups/version-backup.sql"; then
            echo "FAIL: backup file does not contain expected table 'version_table'"
            cat "$GITHUB_WORKSPACE/backups/version-backup.sql"
            exit 1
          fi
          echo "PASS: backup file contains expected table"
