name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  shellcheck:
    name: Run shellcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: shellcheck
        uses: reviewdog/action-shellcheck@96fa305c16b0f9cc9b093af22dcd09de1c8f1c2d # v1.19

  test-postgresql:
    name: Test pg_dump with PostgreSQL version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgresql_version: [12, 14, 15]
    services:
      postgres:
        image: postgres:${{ matrix.postgresql_version }}
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_user_password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 
          persist-credentials: false  # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token

      - name: Run pg_dump
        uses: ./
        with:
          database_url: "postgres://test_user:test_user_password@localhost:5432/testdb"
          postgresql_version: ${{ matrix.postgresql_version }}
          path: "backups/${{ matrix.postgresql_version }}/backup.sql"

      - name: Check changes to the backup file.
        id: changed_backup
        if: matrix.platform == 'ubuntu-latest'
        uses: tj-actions/verify-changed-files@2acec78834cc690f70b3445712363fc314224127 # v17
        with:
          files: backups/${{ matrix.postgresql_version }}/backup.sql
          
      - name: Commit changes to backup file.
        if: steps.changed_backup.outputs.files_changed == 'true' && matrix.platform == 'ubuntu-latest'
        env:
          POSTGRESQL_VERSION: ${{ matrix.postgresql_version }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add "backups/$POSTGRESQL_VERSION/backup.sql"
          git commit -m "Auto updated backup.sql."
      
      - name: Push changes
        if: steps.changed_backup.outputs.files_changed == 'true' && matrix.platform == 'ubuntu-latest'
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # master
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          branch: ${{ github.head_ref }}
        
  test:
    runs-on: ubuntu-latest
    name: Test pg_dump
    services:
      postgres:
        image: postgres:9.6.24
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_user_password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # otherwise, you will failed to push refs to dest repo
          persist-credentials: false  # otherwise, the token used is the GITHUB_TOKEN, instead of your personal token

      - name: Run pg_dump
        uses: ./
        with:
          database_url: "postgres://test_user:test_user_password@localhost:5432/testdb"
          path: "backups/backup.sql"

      - name: Check changes to backup file.
        id: changed_backup
        uses: tj-actions/verify-changed-files@2acec78834cc690f70b3445712363fc314224127 # v17
        with:
          files: backups/backup.sql
          
      - name: Commit changes to backup file.
        if: steps.changed_backup.outputs.files_changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add backups/backup.sql
          git commit -m "Auto updated backup.sql."
      
      - name: Push changes
        if: steps.changed_backup.outputs.files_changed == 'true'
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # master
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          branch: ${{ github.head_ref }}
